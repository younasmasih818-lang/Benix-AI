<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benix AI</title>
  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:#0a0a0f;
      color:#e8e8f0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
    }
    .card{
      width:90%;
      max-width:420px;
      padding:30px;
      border-radius:24px;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.12);
      box-shadow:0 0 40px rgba(0,229,160,0.15);
    }
    .logo{
      width:80px;
      height:80px;
      margin:auto;
      border-radius:22px;
      background:linear-gradient(135deg,#00e5a0,#00c8ff);
      color:#0a0a0f;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:36px;
      font-weight:bold;
      box-shadow:0 0 40px rgba(0,229,160,0.35);
    }
    h1{
      font-size:32px;
      margin:20px 0 8px;
    }
    span{
      background:linear-gradient(135deg,#00e5a0,#00c8ff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }
    p{
      color:#a0a0b8;
      line-height:1.6;
    }
    button{
      margin-top:20px;
      padding:14px 28px;
      border:none;
      border-radius:14px;
      background:linear-gradient(135deg,#00e5a0,#00c8ff);
      color:#0a0a0f;
      font-weight:bold;
      font-size:16px;
      cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">B</div>
    <h1><span>Benix AI</span></h1>
    <p>The Smart AI Assistant is live successfully.</p>
    <button onclick="alert('Benix AI is working!')">Test App</button>
  </div>
</body>
</html>
