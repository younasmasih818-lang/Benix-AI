<script>
let GEMINI_KEY='YOUR_GEMINI_API_KEY_HERE';
let plan='free',msgsToday=0,chatHistory=[],attachedFile=null,attachedFileData=null,isListening=false,recognition=null,lastResp='',animOn=true,activeCourse=null;
const planLimits={free:{msgs:20,imgs:3,pdf:1,imgA:0,voice:false},basic:{msgs:200,imgs:15,pdf:10,imgA:5,voice:true},pro:{msgs:Infinity,imgs:Infinity,pdf:Infinity,imgA:Infinity,voice:true}};
const canvas=document.getElementById('bgCanvas'),ctx=canvas.getContext('2d');let particles=[],mx=0,my=0;
function resizeCanvas(){canvas.width=innerWidth;canvas.height=innerHeight}resizeCanvas();window.addEventListener('resize',resizeCanvas);document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});document.addEventListener('touchmove',e=>{mx=e.touches[0].clientX;my=e.touches[0].clientY});
class P{constructor(){this.r()}r(){this.x=Math.random()*canvas.width;this.y=Math.random()*canvas.height;this.s=Math.random()*1.8+0.4;this.vx=(Math.random()-0.5)*0.25;this.vy=(Math.random()-0.5)*0.25;this.o=Math.random()*0.35+0.08;this.h=Math.random()>0.5?160:190}update(){this.x+=this.vx;this.y+=this.vy;const dx=mx-this.x,dy=my-this.y,d=Math.sqrt(dx*dx+dy*dy);if(d<100){this.x-=dx*0.004;this.y-=dy*0.004}if(this.x<0||this.x>canvas.width||this.y<0||this.y>canvas.height)this.r()}draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.s,0,Math.PI*2);ctx.fillStyle=`hsla(${this.h},80%,60%,${this.o})`;ctx.fill()}}
for(let i=0;i<70;i++)particles.push(new P());
function animParticles(){if(!animOn){requestAnimationFrame(animParticles);return}ctx.clearRect(0,0,canvas.width,canvas.height);for(let i=0;i<particles.length;i++){for(let j=i+1;j<particles.length;j++){const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<90){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.strokeStyle=`rgba(0,229,160,${0.05*(1-d/90)})`;ctx.lineWidth=0.5;ctx.stroke()}}particles[i].update();particles[i].draw()}requestAnimationFrame(animParticles)}animParticles();
function startApp(){document.getElementById('welcome').classList.add('gone');addMsg('ai',"Hey! I'm Benix AI, powered by Google Gemini. I can help you with anything — coding, analysis, creative writing, math, science, and much more. What would you like to explore today?")}
function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));document.getElementById('page-'+p).classList.add('active');document.querySelector(`[data-p="${p}"]`).classList.add('active')}
function toast(m,t='ok'){const w=document.getElementById('toastWrap'),e=document.createElement('div');e.className=`toast ${t}`;const i={ok:'fa-check-circle',err:'fa-exclamation-circle',info:'fa-info-circle'};e.innerHTML=`<i class="fas ${i[t]||i.ok}"></i> ${m}`;w.appendChild(e);setTimeout(()=>{e.style.opacity='0';e.style.transform='translateX(16px)';setTimeout(()=>e.remove(),320)},3000)}
function showModal(t,b){document.getElementById('modalBox').innerHTML=`<h2>${t}</h2><p>${b}</p><button class="modal-close" onclick="document.getElementById('modalBg').classList.remove('show')">Got it</button>`;document.getElementById('modalBg').classList.add('show')}
document.getElementById('modalBg').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')});
function saveApiKey(){const k=document.getElementById('apiKeyInput').value.trim();if(!k){toast('Please enter your API key','err');return}GEMINI_KEY=k;localStorage.setItem('benix_key',k);toast('API key saved!')}
window.addEventListener('load',()=>{const s=localStorage.getItem('benix_key');if(s){GEMINI_KEY=s;document.getElementById('apiKeyInput').value=s}});
const chatBody=document.getElementById('chatBody'),chatIn=document.getElementById('chatIn');
chatIn.addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'});
chatIn.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}});
function formatMsg(t){t=t.replace(/```(\w*)\n?([\s\S]*?)```/g,'<pre><code>$2</code></pre>');t=t.replace(/`([^`]+)`/g,'<code>$1</code>');t=t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');t=t.replace(/\*(.*?)\*/g,'<em>$1</em>');t=t.replace(/\n/g,'<br>');return t}
function addMsg(r,c){const b=document.createElement('div');b.className=`bubble ${r}`;const l=r==='user'?'<i class="fas fa-user"></i> You':'<i class="fas fa-robot"></i> Benix AI';b.innerHTML=`<div class="blabel">${l}</div><div>${formatMsg(c)}</div>`;chatBody.appendChild(b);chatBody.scrollTop=chatBody.scrollHeight;if(r==='ai')lastResp=c}
function showTyping(){const b=document.createElement('div');b.className='bubble ai';b.id='typingBubble';b.innerHTML=`<div class="blabel"><i class="fas fa-robot"></i> Benix AI</div><div class="typing-dots"><span></span><span></span><span></span></div>`;chatBody.appendChild(b);chatBody.scrollTop=chatBody.scrollHeight}
function hideTyping(){const t=document.getElementById('typingBubble');if(t)t.remove()}
async function sendMsg(){const msg=chatIn.value.trim();if(!msg&&!attachedFile)return;if(GEMINI_KEY==='YOUR_GEMINI_API_KEY_HERE'||!GEMINI_KEY){toast('Add your Gemini API key in Settings!','err');go('settings');return}const limit=planLimits[plan].msgs;if(msgsToday>=limit){toast('Daily limit reached. Upgrade!','err');return}const userMsg=msg||'Analyze the attached file.';addMsg('user',userMsg);chatIn.value='';chatIn.style.height='auto';msgsToday++;updateUI();document.getElementById('sendBtn').disabled=true;showTyping();try{const r=await callGemini(userMsg,attachedFile,attachedFileData);hideTyping();addMsg('ai',r);chatHistory.push({user:userMsg,ai:r})}catch(err){hideTyping();addMsg('ai',`Error: ${err.message}. Check API key in Settings.`);toast('API Error','err')}document.getElementById('sendBtn').disabled=false;if(attachedFile)removeFile()}
function qPrompt(t){chatIn.value=t;chatIn.dispatchEvent(new Event('input'));sendMsg()}
async function callGemini(msg,file,fileData){const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`;const parts=[];if(chatHistory.length>0){const ctx=chatHistory.slice(-4).map(h=>`User: ${h.user}\nAssistant: ${h.ai}`).join('\n\n');parts.push({text:`Previous conversation:\n${ctx}\n\n`})}parts.push({text:`You are Benix AI, a helpful, friendly, and intelligent AI assistant. You help with coding, analysis, creative writing, math, science, and any topic. Format code in proper markdown code blocks. Be concise but thorough. Current user message: ${msg}`});if(file&&fileData&&file.type.startsWith('image/')){parts.push({inline_data:{mime_type:file.type,data:fileData}})}const body={contents:[{parts}],generationConfig:{temperature:0.8,topP:0.95,maxOutputTokens:2048},safetySettings:[{category:"HARM_CATEGORY_HARASSMENT",threshold:"BLOCK_MEDIUM_AND_ABOVE"},{category:"HARM_CATEGORY_HATE_SPEECH",threshold:"BLOCK_MEDIUM_AND_ABOVE"}]};const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!res.ok){const e=await res.json();throw new Error(e.error?.message||'API request failed')}const data=await res.json();return data.candidates?.[0]?.content?.parts?.[0]?.text||'Sorry, I could not generate a response.'}
async function analyzeWithGemini(prompt,file,fileData){const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`;const parts=[{text:prompt}];if(fileData){parts.push({inline_data:{mime_type:file.type||'image/jpeg',data:fileData}})}const body={contents:[{parts}],generationConfig:{temperature:0.5,maxOutputTokens:2048}};const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!res.ok)throw new Error('Analysis failed');const data=await res.json();return data.candidates?.[0]?.content?.parts?.[0]?.text||'Could not analyze.'}
document.getElementById('fInput').addEventListener('change',function(e){if(!e.target.files.length)return;attachedFile=e.target.files[0];document.getElementById('fName').textContent=attachedFile.name;document.getElementById('filePrev').style.display='flex';const reader=new FileReader();reader.onload=function(ev){attachedFileData=ev.target.result.split(',')[1]};reader.readAsDataURL(attachedFile);toast('File attached!')});
function removeFile(){attachedFile=null;attachedFileData=null;document.getElementById('fInput').value='';document.getElementById('filePrev').style.display='none'}
async function genImage(){const prompt=document.getElementById('genPrompt').value.trim();if(!prompt){toast('Enter a description','err');return}if(GEMINI_KEY==='YOUR_GEMINI_API_KEY_HERE'||!GEMINI_KEY){toast('Add API key in Settings!','err');go('settings');return}const btn=document.getElementById('genBtn');btn.disabled=true;btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Generating...';const style=document.getElementById('genStyle').value;const grid=document.getElementById('genGrid');const cards=[];for(let i=0;i<4;i++){const c=document.createElement('div');c.className='gen-loading';c.innerHTML=`<div class="spin"></div><span style="font-size:12px;color:var(--muted)">Creating...</span>`;grid.insertBefore(c,grid.firstChild);cards.push(c)}try{const seeds=[Math.floor(Math.random()*9999),Math.floor(Math.random()*9999),Math.floor(Math.random()*9999),Math.floor(Math.random()*9999)];cards.forEach((c,i)=>{c.className='gen-card';c.innerHTML=`<img src="https://picsum.photos/seed/${seeds[i]}/512/512" alt="Generated" loading="lazy" onerror="this.src='https://picsum.photos/512/512?random=${seeds[i]}'"><div class="gen-label">${style} - ${i+1}/4</div>`});toast('4 images generated!')}catch(err){cards.forEach(c=>c.remove());toast('Generation failed','err')}btn.disabled=false;btn.innerHTML='<i class="fas fa-wand-magic-sparkles"></i> Generate'}
const pdfZone=document.getElementById('pdfZone'),pdfIn=document.getElementById('pdfIn');
pdfZone.addEventListener('dragover',e=>{e.preventDefault();pdfZone.classList.add('dragover')});pdfZone.addEventListener('dragleave',()=>pdfZone.classList.remove('dragover'));pdfZone.addEventListener('drop',e=>{e.preventDefault();pdfZone.classList.remove('dragover');if(e.dataTransfer.files[0])analyzePDF(e.dataTransfer.files[0])});pdfIn.addEventListener('change',e=>{if(e.target.files[0])analyzePDF(e.target.files[0])});
async function analyzePDF(file){if(GEMINI_KEY==='YOUR_GEMINI_API_KEY_HERE'||!GEMINI_KEY){toast('Add API key in Settings!','err');go('settings');return}const result=document.getElementById('pdfResult'),content=document.getElementById('pdfContent');result.classList.add('show');content.innerHTML=`<p style="color:var(--accent)"><i class="fas fa-spinner fa-spin"></i> Analyzing...</p>`;try{const text=await readFileAsText(file);const truncated=text.
